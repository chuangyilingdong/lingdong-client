# 灵动ai 创作客户端 —— profile 补丁层（Windows 桌面端）
#
# 写进 `$DSH_HOME/profiles/desktop/cordis.patch.yml`（官方留的"用户补丁层"，默认是 `[]`）。
# 由客户端的登录门在拿到网关密钥后写入（见 deploy/desktop/client-patch/platform-gate.ts）。
#
# 作用：**把模型调用全部收进我们自己的网关**，并关掉给孩子用不合适的成人入口。
# 原型是 `deploy/dsh-student/student-runtime.cordis.yml`（Linux 学生环境那份），
# 但桌面端与那份有两处**必须不同**：
#   ① 沙箱/工作区：桌面端由学生自己选工作区（dsh 的目录选择器），不写死 workspaceRoot；
#      Windows 上是 ACL 后端（`@deepseek-ai/dsh-sandbox-windows-acl`），不是 Landlock。
#   ② 不设 `skill-filesystem` 的课程技能目录：桌面端没有我们烤好的技能目录（那是宿主上的）。
#
# ⚠️ `input: [text, image]` **不能省**：dsh 对**手写声明的模型**默认只认文本
#    （官方原文：Declaring images is what makes a hand-declared vision model usable），
#    不声明的话学生贴的图根本不会进请求体。
# ⚠️ 这里的模型 id 只是**给学生看的槽位名**，不是上游真名：学生选了哪个名字，由我们网关在
#    自己渠道的模型清单里解析（认得出就用它，认不出用该渠道默认模型）——改这里不影响计费。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      platform-gateway:
        displayName: 灵动ai
        apiKeyEnv: PLATFORM_GATEWAY_KEY
        api: openai-completions
        baseURL: !!js process.env.PLATFORM_GATEWAY_BASE_URL
        # 每次请求的图片总预算：历史里的每张图都会被重新编进每一次请求体，不设预算必然撞上限。
        # 8MiB ≈ 30 张我们的截图，而一轮"看自己的产物"通常只读 4-12 张。
        # 控制图片上下文成本：截图会反复进入历史，旧图超出后由 image-offload 替换。
        requestImagePixelBudget: 2073600
        requestImageMaxBytes: 786432
        maxRequestImageBytes: 3145728
        compat:
          supportsUsageInStreaming: true
        models:
          # LINGDONG_MODELS_BEGIN
          - id: deepseek-flash
            name: DeepSeek Flash
            input: [text, image]
          - id: deepseek-pro
            name: DeepSeek Pro
            input: [text, image]
          # LINGDONG_MODELS_END

# 默认模型必须指到我们网关，并把官方那条直连路由关掉 —— 否则学生一发消息就 MISSING_CREDENTIAL
# （客户端里没有官方 key），而且会在模型选择器里挑到一个必然失败的模型。
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: platform-gateway
    model: deepseek-flash # LINGDONG_DEFAULT_MODEL
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

# 审批与权限预设：桌面端也是孩子用，不弹"等你点同意"。
# 官方语义：'never' = every ask resolves 'rejected'（**直接拒绝**，不是自动放行）。
# ⚠️ 沙箱模式必须与审批策略配成同一个预设，否则组合期直接报错
#    「composed sandbox and approval defaults match no preset」。
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: 'never'
# 2026-09-25：按产品要求恢复「完全访问权限」并设为默认（LINGDONG_DEFAULT_PRESET）。
# ⚠️ 这一档 = sandbox: danger-full-access + approval: never：agent 可以读写**整台机器**（工作区外也算），
#    而且我们的审批策略是 never（不弹确认）。孩子机上意味着其它班级目录、系统目录都在范围内。
#    上游 base 里的定义就是这三档，我们之前只声明了前两档（等于把完全访问拿掉）。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: danger-full-access
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# 成人入口：cordis-*-runner 让模型自己写 JS 并以临时插件挂进宿主（官方注释写明在 Web 面上
# 沙箱与审批两道都会被绕过）；插件管理与"用别的应用打开"对孩子是多余且危险的面。
# ⚠️ 只关 host 侧 runner 会让界面起不来（客户端面板 ui-cordis 在等那个服务），两边必须一起关。
- {id: cordis-host-runner, name: '@deepseek-ai/dsh-cordis-host-runner', disabled: true}
- {id: cordis-client-runner, name: '@deepseek-ai/dsh-cordis-client-runner', disabled: true}
- {id: ui-cordis, name: '@deepseek-ai/dsh-client-ui-cordis', disabled: true}
- {id: plugin-inventory, name: '@deepseek-ai/dsh-host-plugin-inventory', disabled: true}
- {id: ui-plugin-manager, name: '@deepseek-ai/dsh-client-ui-plugin-manager', disabled: true}
- {id: open-in-app, name: '@deepseek-ai/dsh-host-open-in-app', disabled: true}

# LINGDONG_STUDENT_UI（2026-09-25）：
#   - web-ui-skill-explorer：dsh-web 聚合包里默认 disabled 的「技能中心」，学生端要开。
#   - web-ui-remote-web-ui：手机配对/远程控制面板 —— 配对设备是完全控制凭据（能读写工作区、
#     跑终端、驱动 agent），还会一键起 cloudflared 隧道把本机暴露到公网；学生端必须关。
- {id: web-ui-skill-explorer, disabled: false}
- {id: web-ui-remote-web-ui, disabled: true}
# 2026-09-27：关掉「创意工坊商店 / 社区插件 / 插件管理器」三张卡（聚合包插的行，默认是开的）。
# 它们能从 npm / git / dsh-market.com 装第三方插件，还能按行改聚合包的 disabled —— 包括把
# web-ui-remote-web-ui 打开（手机配对 = 完全控制凭据 + cloudflared 公网隧道）。学生端不需要这三张卡。
- {id: web-ui-market, disabled: true}
- {id: web-ui-community-plugins, disabled: true}
- {id: web-ui-plugin-manager, disabled: true}
# 0.4.3 新增自更新入口：它会在 profile 内执行 pnpm update --latest，客户端更新必须由桌面外壳统一管理。
- {id: web-ui-update, disabled: true}
# rc.2 已自带 ui-sidebar-browser，明确接受 HTTP/HTTPS 的 loopback 地址；0.21.1 也把浏览器
# 页签委托给宿主该实现，且其 config schema 已没有 browserAllowedLoopback。不要再写这个字段，
# 否则较严格的 Loader 配置校验可能把插件行判为无效。
# 学生端禁止上传会话遥测与官方会话日志。反馈仍只保存在本地。
- {id: session-telemetry-otel, name: '@deepseek-ai/dsh-session-telemetry-otel', disabled: true}
- {id: session-log-deepseek, name: '@deepseek-ai/dsh-session-log-deepseek', disabled: true}
