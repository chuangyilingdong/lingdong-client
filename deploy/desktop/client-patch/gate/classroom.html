<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:;" />
<title>选择课堂 · 灵动ai创作客户端</title>
<style>
  :root { color-scheme: dark; --rose: #e6394f; --rose-deep: #c7253b; }
  * { box-sizing: border-box; }
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 48px; -webkit-app-region: drag; z-index: 100; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 96% at 42% 34%, #7e1123 0%, #65101d 42%, #4d0a15 100%); color: #f7f1f0; font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  main { width: min(720px, calc(100vw - 56px)); padding: 34px; border: 1px solid rgba(255,255,255,.16); border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)); box-shadow: 0 26px 60px rgba(0,0,0,.34); }
  .logo { display: block; width: 170px; margin: 0 auto 14px; }
  h1 { margin: 0 0 6px; text-align: center; font-size: 22px; }
  .lead { margin: 0 0 22px; text-align: center; color: rgba(255,255,255,.62); font-size: 13px; }
  .list { display: grid; gap: 12px; }
  .classroom { width: 100%; padding: 16px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; text-align: left; cursor: pointer; font: inherit; }
  .classroom:hover { background: rgba(255,255,255,.14); border-color: rgba(253,76,100,.56); }
  .title { display: block; font-weight: 800; font-size: 15px; }
  .meta { display: block; margin-top: 4px; color: rgba(255,255,255,.58); font-size: 12px; }
  .foot { display: flex; justify-content: center; margin-top: 18px; }
  .ghost { padding: 9px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="灵动ai" />
  <h1>请选择要进入的课堂</h1>
  <p class="lead">后台检测到你的账号有多个未结束课堂，请选择这一次要进入的课堂。</p>
  <div class="list" id="list"></div>
  <div class="foot"><button class="ghost" id="logout" type="button">退出登录</button></div>
</main>
<script>
  const render = () => {
    const state = window.__LINGDONG_STATE__ || {}
    const list = document.getElementById('list')
    list.textContent = ''
    const classrooms = Array.isArray(state.classrooms) ? state.classrooms : []
    for (const classroom of classrooms) {
      const button = document.createElement('button')
      button.type = 'button'
      button.className = 'classroom'
      const title = document.createElement('span')
      title.className = 'title'
      title.textContent = [classroom.seriesTitle, classroom.lessonTitle].filter(Boolean).join(' › ') || classroom.title || '课堂'
      const meta = document.createElement('span')
      meta.className = 'meta'
      meta.textContent = [classroom.teacherName && `老师：${classroom.teacherName}`, classroom.title, classroom.startedAt && `开始：${new Date(classroom.startedAt).toLocaleString()}`].filter(Boolean).join(' · ')
      button.append(title, meta)
      button.addEventListener('click', () => { void window.lingdong.gate({ action: 'select-classroom', sessionId: classroom.id }) })
      list.append(button)
    }
  }
  window.__lingdongRender = render
  render()
  document.getElementById('logout').addEventListener('click', () => { void window.lingdong.gate({ action: 'logout' }) })
</script>
</body>
</html>
