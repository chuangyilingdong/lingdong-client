<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:;" />
<title>等老师开始上课 · 灵动ai创作客户端</title>
<style>
  :root { color-scheme: dark; --rose: #dd354b; --rose-deep: #c7253b; }
  * { box-sizing: border-box; }
  /* 无边框窗口顶部是拖动区；不会覆盖表单与按钮。 */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 48px;
    -webkit-app-region: drag; z-index: 100;
  }

  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 96% at 42% 34%, #7e1123 0%, #65101d 42%, #4d0a15 100%);
    color: #f7f1f0; font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  main {
    width: min(520px, calc(100vw - 56px)); padding: 38px 38px 32px; text-align: center;
    border: 1px solid rgba(255,255,255,.16); border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
    box-shadow: 0 26px 60px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(14px);
  }
  .logo { display: block; width: 168px; margin: 0 auto 20px; }
  .dot {
    width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(253,76,100,.16); color: #fd4c64; font-size: 26px;
  }
  h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0 0 6px; color: rgba(255,255,255,.62); font-size: 13.5px; }
  .name { color: #fff; font-weight: 800; }
  .row { display: flex; gap: 12px; margin-top: 26px; }
  button {
    flex: 1; height: 50px; border: 0; border-radius: 13px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .primary { color: #fff; background: linear-gradient(180deg, #e6394f, var(--rose-deep)); box-shadow: 0 12px 26px rgba(199,37,59,.32); }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }
  .primary:disabled { opacity: .62; cursor: default; }
  .ghost { color: rgba(255,255,255,.86); background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); }
  .ghost:hover { background: rgba(255,255,255,.16); }
  .tip { margin-top: 20px; color: rgba(255,255,255,.34); font-size: 11.5px; }
  .upcoming { margin-top: 12px; color: #ffc9d3; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="灵动ai" />
  <h1 id="title">老师还没有开始上课</h1>
  <p><span class="name" id="name"></span><span id="hint"></span></p>
  <p class="upcoming" id="upcoming" hidden></p>
  <div class="row">
    <button class="primary" id="refresh" type="button">刷新</button>
    <button class="ghost" id="logout" type="button">退出登录</button>
  </div>
</main>
<script>
  const render = () => {
    const state = window.__LINGDONG_STATE__ || {}
    if (state.name) document.getElementById('name').textContent = String(state.name) + '，'
    document.getElementById('hint').textContent = String(state.message || '老师还没有开始上课')
    const upcoming = state.upcoming
    const upcomingLine = document.getElementById('upcoming')
    if (upcoming && typeof upcoming === 'object') {
      const course = [upcoming.seriesTitle, upcoming.lessonTitle].filter(Boolean).join(' › ') || upcoming.title || '下一节课'
      upcomingLine.textContent = `接下来：${course}${upcoming.teacherName ? ` · ${upcoming.teacherName}` : ''}`
      upcomingLine.hidden = false
    }
  }
  window.__lingdongRender = render
  render()
  document.getElementById('refresh').addEventListener('click', async () => {
    const button = document.getElementById('refresh')
    button.disabled = true
    button.textContent = '检查中…'
    await window.lingdong.gate({ action: 'refresh' })
  })
  document.getElementById('logout').addEventListener('click', () => { void window.lingdong.gate({ action: 'logout' }) })
</script>
</body>
</html>
