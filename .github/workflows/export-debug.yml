name: Export workflow status

on:
  push:
    paths:
      - '.github/workflows/export-debug.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish status branch
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/workflows/build-mac-arm64.yml/runs?per_page=20" > build-runs.json
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/workflows/export-mac-artifact.yml/runs?per_page=20" > export-runs.json
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- build runs ---'
            jq -r '.workflow_runs[] | [.id,.head_sha,.status,(.conclusion // ""),.created_at,(.html_url // "")] | @tsv' build-runs.json
            echo '--- export runs ---'
            jq -r '.workflow_runs[] | [.id,.head_sha,.status,(.conclusion // ""),.created_at,(.html_url // "")] | @tsv' export-runs.json
          } > status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/export-debug
          mkdir -p .ci/export-debug
          cp status.txt build-runs.json export-runs.json .ci/export-debug/
          git add -f .ci/export-debug/*
          git commit -m "ci: publish workflow status ${GITHUB_RUN_ID}"
          git push --force origin HEAD:ci/export-debug