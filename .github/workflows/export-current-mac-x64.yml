# Release trigger: Lingdong 0.2.23 multipart upload release.
# Export the matching macOS Intel build artifact through the CI branch.
name: Export current ZCode mac Intel artifact

on:
  push:
    branches: [codex/zcode-migration]
    paths: [".github/workflows/export-current-mac-x64.yml"]

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_SHA: ef9fcaa5a5249a885260dbbf4dd3acef32be4eb1
      TARGET_BRANCH: ci/zcode-current-mac-x64
    steps:
      - uses: actions/checkout@v4
      - name: Wait and export
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          target_version=$(jq -r '.version' package.json)
          source_artifact="lingdong-client-${target_version}-mac-x64"
          test "$target_version" != "null"
          run_id=""
          for attempt in $(seq 1 360); do
            curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/workflows/build-mac-x64.yml/runs?head_sha=${SOURCE_SHA}&per_page=20" > runs.json
            run_id=$(jq -r --arg sha "$SOURCE_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' runs.json | head -n 1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' runs.json)
              conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")' runs.json)
              echo "attempt=${attempt} run_id=${run_id} status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] || { echo "mac x64 build failed"; exit 1; }
                break
              fi
            else
              echo "attempt=${attempt} waiting for mac x64 build of ${SOURCE_SHA}"
            fi
            sleep 30
          done
          test -n "$run_id" && test "$run_id" != "null"
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/runs/${run_id}/artifacts" > artifacts.json
          artifact_id=$(jq -r --arg name "$source_artifact" '.artifacts[] | select(.name == $name) | .id' artifacts.json | head -n 1)
          test -n "$artifact_id" && test "$artifact_id" != "null"
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/actions/artifacts/${artifact_id}/zip" -o artifact.zip
          rm -rf downloaded chunks; mkdir -p downloaded chunks
          unzip -q artifact.zip -d downloaded
          dmg=$(find downloaded -type f -name '*.dmg' -print -quit); test -n "$dmg"
          cp "$dmg" "chunks/lingdong-client-${target_version}-mac-x64.dmg"
          split -b 64m "chunks/lingdong-client-${target_version}-mac-x64.dmg" chunks/dmg-part-
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$TARGET_BRANCH"; rm -rf ".ci/$TARGET_BRANCH"; mkdir -p ".ci/$TARGET_BRANCH"
          printf 'started source_run=%s source_sha=%s artifact=%s\n' "$run_id" "$SOURCE_SHA" "$artifact_id" > ".ci/$TARGET_BRANCH/status.txt"
          git add -f ".ci/$TARGET_BRANCH/status.txt"; git commit -m "ci: start current ZCode mac x64 export $run_id"; git push --force origin HEAD:"$TARGET_BRANCH"
          for part in chunks/dmg-part-*; do
            cp "$part" ".ci/$TARGET_BRANCH/"
            git add -f ".ci/$TARGET_BRANCH/$(basename "$part")"
            git commit -m "ci: add $(basename "$part") $run_id"
            git push origin HEAD:"$TARGET_BRANCH"
          done
          printf 'complete source_run=%s source_sha=%s artifact=%s\n' "$run_id" "$SOURCE_SHA" "$artifact_id" > ".ci/$TARGET_BRANCH/status.txt"
          git add -f ".ci/$TARGET_BRANCH/status.txt"; git commit -m "ci: complete current ZCode mac x64 export $run_id"; git push origin HEAD:"$TARGET_BRANCH"
