name: Export macOS artifact chunks

on:
  push:
    paths:
      - '.github/workflows/export-mac-artifact.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_SHA: e4062f6
      SOURCE_WORKFLOW: build-mac-arm64.yml
      SOURCE_ARTIFACT: lingdong-client-0.1.7-rc.2.10-mac-arm64
      TARGET_VERSION: 0.1.7-rc.2.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for build and export DMG chunks
        shell: bash
        run: |
          set -euo pipefail
          log=export.log
          exec > >(tee "$log") 2>&1
          finish() {
            status=$?
            echo "EXPORT_EXIT=$status" >> "$log"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if [ "$status" -ne 0 ]; then
              git checkout -B ci/export-status
              mkdir -p .ci/export-status
              cp "$log" .ci/export-status/latest.log
              git add -f .ci/export-status/latest.log
              git commit -m "ci: export failed for ${TARGET_SHA}" || true
              git push --force origin HEAD:ci/export-status || true
            fi
          }
          trap finish EXIT

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_id=""
          for attempt in $(seq 1 360); do
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/actions/workflows/${SOURCE_WORKFLOW}/runs?head_sha=${TARGET_SHA}&per_page=20" > runs.json
            run_id=$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' runs.json | head -n 1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' runs.json)
              conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")' runs.json)
              echo "attempt=${attempt} run_id=${run_id} status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] || { echo "source run failed"; exit 1; }
                break
              fi
            else
              echo "attempt=${attempt} source run not found yet"
            fi
            sleep 30
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "timed out waiting for source run"
            exit 1
          fi

          artifacts_url="${api}/actions/runs/${run_id}/artifacts"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "$artifacts_url" > artifacts.json
          artifact_id=$(jq -r --arg name "$SOURCE_ARTIFACT" '.artifacts[] | select(.name == $name) | .id' artifacts.json | head -n 1)
          test -n "$artifact_id"
          test "$artifact_id" != "null"
          echo "artifact_id=${artifact_id}"

          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/actions/artifacts/${artifact_id}/zip" -o artifact.zip
          rm -rf downloaded
          mkdir -p downloaded
          unzip -q artifact.zip -d downloaded
          dmg=$(find downloaded -type f -name '*.dmg' -print -quit)
          test -n "$dmg"

          rm -rf chunks
          mkdir -p chunks
          cp "$dmg" "chunks/lingdong-client-${TARGET_VERSION}-mac-arm64.dmg"
          split -b 64m "chunks/lingdong-client-${TARGET_VERSION}-mac-arm64.dmg" "chunks/dmg-part-"
          ls -lh chunks

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/mac-artifact
          mkdir -p .ci/mac-artifact
          printf 'started source_run=%s\n' "$run_id" > .ci/mac-artifact/status.txt
          git add -f .ci/mac-artifact/status.txt
          git commit -m "ci: start mac dmg export ${run_id}"
          git push --force origin HEAD:ci/mac-artifact
          for part in chunks/dmg-part-*; do
            cp "$part" .ci/mac-artifact/
            git add -f ".ci/mac-artifact/$(basename "$part")"
            git commit -m "ci: add $(basename "$part") ${run_id}"
            git push origin HEAD:ci/mac-artifact
          done
          printf 'complete source_run=%s\n' "$run_id" > .ci/mac-artifact/status.txt
          git add -f .ci/mac-artifact/status.txt
          git commit -m "ci: complete mac dmg export ${run_id}"
          git push origin HEAD:ci/mac-artifact