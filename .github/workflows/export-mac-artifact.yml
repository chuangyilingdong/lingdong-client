name: Export macOS artifact chunks

on:
  push:
    paths:
      - '.github/workflows/export-mac-artifact.yml'

permissions:
  actions: write
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      STALE_RUN_ID: '36396056770'
      SOURCE_RUN_ID: '36395849469'
      SOURCE_ARTIFACT: lingdong-client-0.1.7-rc.2.10-mac-arm64
      TARGET_VERSION: 0.1.7-rc.2.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel stale exporter and download DMG
        shell: bash
        run: |
          set -euo pipefail
          log=export.log
          exec > >(tee "$log") 2>&1
          finish() {
            status=$?
            echo "EXPORT_EXIT=$status" >> "$log"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if [ "$status" -ne 0 ]; then
              git checkout -B ci/export-status
              mkdir -p .ci/export-status
              cp "$log" .ci/export-status/latest.log
              git add -f .ci/export-status/latest.log
              git commit -m "ci: export failed for ${SOURCE_RUN_ID}" || true
              git push --force origin HEAD:ci/export-status || true
            fi
          }
          trap finish EXIT

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -X POST --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/actions/runs/${STALE_RUN_ID}/cancel" || true

          artifacts_url="${api}/actions/runs/${SOURCE_RUN_ID}/artifacts"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "$artifacts_url" > artifacts.json
          artifact_id=$(jq -r --arg name "$SOURCE_ARTIFACT" '.artifacts[] | select(.name == $name) | .id' artifacts.json | head -n 1)
          test -n "$artifact_id"
          test "$artifact_id" != "null"
          echo "artifact_id=${artifact_id}"

          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/actions/artifacts/${artifact_id}/zip" -o artifact.zip
          rm -rf downloaded
          mkdir -p downloaded
          unzip -q artifact.zip -d downloaded
          dmg=$(find downloaded -type f -name '*.dmg' -print -quit)
          test -n "$dmg"

          rm -rf chunks
          mkdir -p chunks
          cp "$dmg" "chunks/lingdong-client-${TARGET_VERSION}-mac-arm64.dmg"
          split -b 64m "chunks/lingdong-client-${TARGET_VERSION}-mac-arm64.dmg" "chunks/dmg-part-"
          ls -lh chunks

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/mac-artifact
          mkdir -p .ci/mac-artifact
          printf 'started source_run=%s\n' "$SOURCE_RUN_ID" > .ci/mac-artifact/status.txt
          git add -f .ci/mac-artifact/status.txt
          git commit -m "ci: start mac dmg export ${SOURCE_RUN_ID}"
          git push --force origin HEAD:ci/mac-artifact
          for part in chunks/dmg-part-*; do
            cp "$part" .ci/mac-artifact/
            git add -f ".ci/mac-artifact/$(basename "$part")"
            git commit -m "ci: add $(basename "$part") ${SOURCE_RUN_ID}"
            git push origin HEAD:ci/mac-artifact
          done
          printf 'complete source_run=%s\n' "$SOURCE_RUN_ID" > .ci/mac-artifact/status.txt
          git add -f .ci/mac-artifact/status.txt
          git commit -m "ci: complete mac dmg export ${SOURCE_RUN_ID}"
          git push origin HEAD:ci/mac-artifact