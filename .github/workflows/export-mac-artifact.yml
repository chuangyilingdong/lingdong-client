name: Export macOS artifact chunks (ZCode)

on:
  push:
    branches:
      - codex/zcode-migration
    paths:
      - '.github/workflows/build-mac-arm64.yml'
      - '.github/workflows/export-mac-artifact.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_ARTIFACT: lingdong-client-0.2.0-zcode.1-mac-arm64
      TARGET_VERSION: 0.2.0-zcode.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for mac build and export chunks
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_id=""
          for attempt in $(seq 1 360); do
            curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "${api}/actions/workflows/build-mac-arm64.yml/runs?head_sha=${SOURCE_SHA}&per_page=20" > runs.json
            run_id=$(jq -r --arg sha "$SOURCE_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' runs.json | head -n 1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' runs.json)
              conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")' runs.json)
              echo "attempt=${attempt} run_id=${run_id} status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] || { echo "mac build failed"; exit 1; }
                break
              fi
            fi
            sleep 30
          done
          test -n "$run_id" && test "$run_id" != "null"
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "${api}/actions/runs/${run_id}/artifacts" > artifacts.json
          artifact_id=$(jq -r --arg name "$SOURCE_ARTIFACT" '.artifacts[] | select(.name == $name) | .id' artifacts.json | head -n 1)
          test -n "$artifact_id" && test "$artifact_id" != "null"
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "${api}/actions/artifacts/${artifact_id}/zip" -o artifact.zip
          rm -rf downloaded chunks
          mkdir -p downloaded chunks
          unzip -q artifact.zip -d downloaded
          dmg=$(find downloaded -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          cp "$dmg" "chunks/lingdong-client-${TARGET_VERSION}-mac-arm64.dmg"
          split -b 64m "chunks/lingdong-client-${TARGET_VERSION}-mac-arm64.dmg" chunks/dmg-part-
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/zcode-mac-artifact
          rm -rf .ci/zcode-mac-artifact
          mkdir -p .ci/zcode-mac-artifact
          printf 'started source_run=%s source_sha=%s\n' "$run_id" "$SOURCE_SHA" > .ci/zcode-mac-artifact/status.txt
          git add -f .ci/zcode-mac-artifact/status.txt
          git commit -m "ci: start ZCode mac artifact export ${run_id}"
          git push --force origin HEAD:ci/zcode-mac-artifact
          for part in chunks/dmg-part-*; do
            cp "$part" .ci/zcode-mac-artifact/
            git add -f ".ci/zcode-mac-artifact/$(basename "$part")"
            git commit -m "ci: add $(basename "$part") ${run_id}"
            git push origin HEAD:ci/zcode-mac-artifact
          done
          printf 'complete source_run=%s source_sha=%s\n' "$run_id" "$SOURCE_SHA" > .ci/zcode-mac-artifact/status.txt
          git add -f .ci/zcode-mac-artifact/status.txt
          git commit -m "ci: complete ZCode mac artifact export ${run_id}"
          git push origin HEAD:ci/zcode-mac-artifact
