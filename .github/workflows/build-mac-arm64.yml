name: Build macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      unsigned:
        description: Build an unsigned local-test DMG/ZIP instead of the signed release
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-mac-arm64.yml'
      - 'scripts/build-mac-arm64.sh'
      - 'deploy/desktop/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      LINGDONG_CLIENT_VERSION: 0.1.7-rc.2.9
      LINGDONG_CHECKOUT: ${{ github.workspace }}/.tmp/dsh-0.1.7-rc.2
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone pinned upstream
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness.git "$LINGDONG_CHECKOUT"
          git -C "$LINGDONG_CHECKOUT" checkout 477b4f420553e8a52c2fbccc464d7561b239c443
          git -C "$LINGDONG_CHECKOUT" rev-parse HEAD

      - name: Install upstream dependencies
        working-directory: ${{ env.LINGDONG_CHECKOUT }}
        run: pnpm install --frozen-lockfile

      - name: Build Apple Silicon DMG/ZIP
        id: mac_build
        continue-on-error: true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          DSH_DESKTOP_MACOS_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${{ inputs.unsigned }}" = "true" ]; then
            bash scripts/build-mac-arm64.sh --unsigned 2>&1 | tee build.log
          else
            mkdir -p "$LINGDONG_CHECKOUT/apps/desktop"
            cat > "$LINGDONG_CHECKOUT/apps/desktop/.env.macos" <<EOF
          DSH_DESKTOP_APP_ID=cn.aimagc.lingdong
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://aicyld.com
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://aicyld.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://aicyld.com"]}
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY=${DSH_DESKTOP_MACOS_SIGNING_IDENTITY}
          DSH_DESKTOP_MACOS_TEAM_ID=${DSH_DESKTOP_MACOS_TEAM_ID}
          CSC_LINK=${CSC_LINK}
          CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD}
          APPLE_API_KEY=${APPLE_API_KEY}
          APPLE_API_KEY_ID=${APPLE_API_KEY_ID}
          APPLE_API_ISSUER=${APPLE_API_ISSUER}
          EOF
            bash scripts/build-mac-arm64.sh 2>&1 | tee build.log
          fi

      - name: Publish unsigned build log
        if: always() && github.event_name == 'push'
        run: |
          if [ ! -f build.log ]; then echo 'build.log was not created' > build.log; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/mac-debug
          mkdir -p .ci
          cp build.log .ci/mac-latest.log
          git add -f .ci/mac-latest.log
          git commit -m "ci: record mac build log ${GITHUB_RUN_ID}" || true
          git push --force origin HEAD:ci/mac-debug

      - name: Fail when unsigned build failed
        if: steps.mac_build.outcome == 'failure' && (github.event_name == 'push' || inputs.unsigned == true)
        run: exit 1

      - name: Collect artifacts
        run: |
          mkdir -p dist-mac
          cp "$LINGDONG_CHECKOUT"/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg dist-mac/ 2>/dev/null || true
          cp "$LINGDONG_CHECKOUT"/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.zip dist-mac/ 2>/dev/null || true
          cp "$LINGDONG_CHECKOUT"/apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.dmg dist-mac/ 2>/dev/null || true
          cp "$LINGDONG_CHECKOUT"/apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip dist-mac/ 2>/dev/null || true
          ls -lh dist-mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingdong-client-${{ env.LINGDONG_CLIENT_VERSION }}-mac-arm64
          path: |
            dist-mac/*.dmg
            dist-mac/*.zip
          if-no-files-found: error
          retention-days: 14