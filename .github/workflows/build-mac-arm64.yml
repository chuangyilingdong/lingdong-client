name: Build macOS Apple Silicon (ZCode)

on:
  workflow_dispatch:
    inputs:
      unsigned:
        description: Build an unsigned local-test DMG/ZIP instead of signed release
        required: true
        default: true
        type: boolean
  push:
    branches:
      - codex/zcode-migration
      - main
    paths:
      - '.github/workflows/build-mac-arm64.yml'
      - '.github/workflows/export-mac-artifact.yml'
      - 'packages/**'
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      ZCODE_ENV: production
      ZCODE_PREVIEW_IDENTITY: '0'
      ZCODE_ENABLE_MAC_SIGN: '0'
      ZCODE_DESKTOP_DIST_DIR: ${{ github.workspace }}/dist/mac-arm64
      LINGDONG_API_BASE: https://aicyld.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS DMG/ZIP
        run: pnpm --filter @zcode/desktop run bundle -- --os mac --arch arm64

      - name: Collect artifacts
        run: |
          mkdir -p dist-mac
          cp dist/mac-arm64/*.dmg dist-mac/ 2>/dev/null || true
          cp dist/mac-arm64/*.zip dist-mac/ 2>/dev/null || true
          ls -lh dist-mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingdong-client-0.2.0-zcode.3-mac-arm64
          path: |
            dist-mac/*.dmg
            dist-mac/*.zip
          if-no-files-found: error
          retention-days: 14
